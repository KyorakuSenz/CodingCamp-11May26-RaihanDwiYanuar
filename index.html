<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense & Budget Visualizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>💸 Expense & Budget Visualizer</h1>
    <button id="theme-toggle" aria-label="Toggle dark mode">🌙 Dark Mode</button>
  </header>

  <!-- TOTAL BALANCE -->
  <div class="card balance-card">
    <p class="balance-label">TOTAL BALANCE</p>
    <h2 id="total-balance">Rp 0</h2>
  </div>

  <!-- SPENDING LIMIT -->
  <div class="card">
    <h3>⚠️ Spending Limit per Transaction</h3>
    <div class="limit-row">
      <input type="number" id="limit-input" placeholder="e.g. 50000" min="0" />
      <button id="set-limit-btn">Set Limit</button>
    </div>
    <p id="limit-display">No limit set</p>
  </div>

  <!-- ADD TRANSACTION FORM -->
  <div class="card">
    <h3>Add Transaction</h3>
    <label for="item-name">Item Name</label>
    <input type="text" id="item-name" placeholder="e.g. Nasi Goreng" />

    <label for="item-amount">Amount (Rp)</label>
    <input type="number" id="item-amount" placeholder="e.g. 15000" min="0" />

    <label for="item-category">Category</label>
    <select id="item-category">
      <option value="Food">🍔 Food</option>
      <option value="Transport">🚗 Transport</option>
      <option value="Fun">🎉 Fun</option>
    </select>

    <button id="add-btn">+ Add Transaction</button>
  </div>

  <!-- TRANSACTION LIST & CHART -->
  <div class="bottom-grid">

    <!-- TRANSACTION LIST -->
    <div class="card">
      <div class="list-header">
        <h3>Transactions</h3>
        <select id="sort-select">
          <option value="default">Sort: Default</option>
          <option value="amount-desc">Amount ↓</option>
          <option value="amount-asc">Amount ↑</option>
          <option value="category">Category A–Z</option>
        </select>
      </div>
      <div id="transaction-list">
        <p class="empty-msg" id="empty-msg">No transactions yet. Add one above!</p>
      </div>
    </div>

    <!-- PIE CHART -->
    <div class="card chart-card">
      <h3>Spending by Category</h3>
      <div class="chart-wrap">
        <canvas id="pie-chart"></canvas>
      </div>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
